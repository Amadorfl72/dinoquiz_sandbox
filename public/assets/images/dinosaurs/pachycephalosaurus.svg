<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="pachycephalosaurusTitle">
  <title id="pachycephalosaurusTitle">Pachycephalosaurus</title>
  <!-- Tail -->
  <path d="M90 300 q-38 -10 -42 -44" fill="none" stroke="#8D6E63" stroke-width="26" stroke-linecap="round"/>
  <!-- Legs -->
  <ellipse cx="180" cy="345" rx="24" ry="18" fill="#6D4C41" stroke="#3E2723" stroke-width="6"/>
  <ellipse cx="250" cy="345" rx="24" ry="18" fill="#6D4C41" stroke="#3E2723" stroke-width="6"/>
  <!-- Body -->
  <ellipse cx="215" cy="255" rx="95" ry="70" fill="#8D6E63" stroke="#3E2723" stroke-width="8"/>
  <!-- Belly -->
  <ellipse cx="215" cy="272" rx="55" ry="38" fill="#FBE9E7"/>
  <!-- Arms -->
  <path d="M165 235 q-14 12 -10 28" fill="none" stroke="#8D6E63" stroke-width="12" stroke-linecap="round"/>
  <path d="M265 235 q14 12 10 28" fill="none" stroke="#8D6E63" stroke-width="12" stroke-linecap="round"/>
  <!-- Neck -->
  <ellipse cx="300" cy="195" rx="34" ry="30" fill="#8D6E63" stroke="#3E2723" stroke-width="7"/>
  <!-- Domed head -->
  <circle cx="320" cy="140" r="46" fill="#A1887F" stroke="#3E2723" stroke-width="8"/>
  <!-- Bony bumps around the dome -->
  <g fill="#6D4C41" stroke="#3E2723" stroke-width="3">
    <circle cx="288" cy="172" r="7"/>
    <circle cx="352" cy="172" r="7"/>
    <circle cx="300" cy="185" r="6"/>
    <circle cx="340" cy="185" r="6"/>
  </g>
  <!-- Snout -->
  <path d="M300 165 q-30 8 -40 -6 q14 -10 40 -10 z" fill="#8D6E63" stroke="#3E2723" stroke-width="6"/>
  <!-- Eye -->
  <circle cx="330" cy="128" r="9" fill="#3E2723"/>
  <circle cx="333" cy="125" r="3" fill="#FFFFFF"/>
</svg>
