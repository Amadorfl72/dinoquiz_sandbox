<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="compsognathusTitle">
  <title id="compsognathusTitle">Compsognathus</title>
  <!-- Tail -->
  <path d="M110 290 q-60 -10 -70 -70" fill="none" stroke="#C0CA33" stroke-width="16" stroke-linecap="round"/>
  <!-- Legs -->
  <ellipse cx="195" cy="330" rx="16" ry="12" fill="#9E9D24" stroke="#33691E" stroke-width="5"/>
  <ellipse cx="240" cy="330" rx="16" ry="12" fill="#9E9D24" stroke="#33691E" stroke-width="5"/>
  <!-- Body -->
  <ellipse cx="220" cy="285" rx="55" ry="42" fill="#C0CA33" stroke="#33691E" stroke-width="7"/>
  <!-- Belly -->
  <ellipse cx="220" cy="298" rx="32" ry="24" fill="#F0F4C3"/>
  <!-- Tiny arms -->
  <path d="M188 270 q-12 8 -8 20" fill="none" stroke="#C0CA33" stroke-width="8" stroke-linecap="round"/>
  <path d="M252 270 q12 8 8 20" fill="none" stroke="#C0CA33" stroke-width="8" stroke-linecap="round"/>
  <!-- Neck -->
  <path d="M255 260 q30 -50 30 -80" fill="none" stroke="#C0CA33" stroke-width="20" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="290" cy="165" rx="26" ry="20" fill="#C0CA33" stroke="#33691E" stroke-width="6"/>
  <!-- Jaw -->
  <path d="M300 178 q22 6 34 -4 q-6 10 -18 12 q-10 2 -16 -8 z" fill="#FFFFFF" stroke="#33691E" stroke-width="4"/>
  <!-- Eye -->
  <circle cx="298" cy="158" r="6" fill="#33691E"/>
  <circle cx="300" cy="156" r="2" fill="#FFFFFF"/>
</svg>
