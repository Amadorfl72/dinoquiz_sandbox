<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="triceratopsRealisticTitle">
  <title id="triceratopsRealisticTitle">Triceratops (ilustración de estilo realista)</title>
  <defs>
    <linearGradient id="triBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E8A6C"/>
      <stop offset="1" stop-color="#5F6B4F"/>
    </linearGradient>
  </defs>
  <!-- Legs -->
  <ellipse cx="140" cy="345" rx="26" ry="18" fill="#4E5940" stroke="#2C331F" stroke-width="6"/>
  <ellipse cx="220" cy="345" rx="26" ry="18" fill="#4E5940" stroke="#2C331F" stroke-width="6"/>
  <ellipse cx="290" cy="335" rx="24" ry="18" fill="#4E5940" stroke="#2C331F" stroke-width="6"/>
  <!-- Body -->
  <ellipse cx="220" cy="260" rx="120" ry="85" fill="url(#triBody)" stroke="#2C331F" stroke-width="8"/>
  <!-- Skin texture -->
  <g stroke="#4E5940" stroke-width="3" opacity="0.6">
    <path d="M200 230 q20 -8 40 0"/>
    <path d="M210 260 q20 -6 40 2"/>
  </g>
  <!-- Belly -->
  <ellipse cx="220" cy="278" rx="72" ry="48" fill="#E7DEC2"/>
  <!-- Frill -->
  <path d="M100 160 q-30 -60 40 -90 q40 30 40 70 z" fill="#5F6B4F" stroke="#2C331F" stroke-width="8"/>
  <!-- Head -->
  <ellipse cx="130" cy="190" rx="68" ry="55" fill="url(#triBody)" stroke="#2C331F" stroke-width="8"/>
  <!-- Horns -->
  <path d="M95 150 l-22 -46 22 20 z" fill="#E8DCC0" stroke="#2C331F" stroke-width="5"/>
  <path d="M145 145 l-4 -50 20 28 z" fill="#E8DCC0" stroke="#2C331F" stroke-width="5"/>
  <path d="M75 195 l-40 5 30 -22 z" fill="#E8DCC0" stroke="#2C331F" stroke-width="5"/>
  <!-- Eye -->
  <circle cx="118" cy="175" r="10" fill="#2C331F"/>
  <circle cx="121" cy="171" r="3.5" fill="#F1E9D2"/>
  <!-- Mouth -->
  <path d="M85 210 q20 14 45 3" fill="none" stroke="#2C331F" stroke-width="5" stroke-linecap="round"/>
</svg>
