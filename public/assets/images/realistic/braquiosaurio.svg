<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="braquiosaurioRealisticTitle">
  <title id="braquiosaurioRealisticTitle">Braquiosaurio (ilustración de estilo realista)</title>
  <defs>
    <linearGradient id="brachioBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E8B79"/>
      <stop offset="1" stop-color="#5C6A57"/>
    </linearGradient>
  </defs>
  <!-- Tail -->
  <path d="M100 300 q-50 0 -60 -40" fill="none" stroke="#6E7F6B" stroke-width="26" stroke-linecap="round"/>
  <!-- Legs -->
  <ellipse cx="170" cy="350" rx="24" ry="18" fill="#4A5747" stroke="#2A3327" stroke-width="6"/>
  <ellipse cx="240" cy="352" rx="26" ry="20" fill="#4A5747" stroke="#2A3327" stroke-width="6"/>
  <!-- Body -->
  <ellipse cx="200" cy="270" rx="110" ry="70" fill="url(#brachioBody)" stroke="#2A3327" stroke-width="8"/>
  <!-- Skin texture -->
  <g stroke="#5C6A57" stroke-width="3" opacity="0.6">
    <path d="M170 250 q18 -8 36 0"/>
  </g>
  <!-- Belly -->
  <ellipse cx="200" cy="288" rx="65" ry="38" fill="#DCD3B8"/>
  <!-- Long neck -->
  <path d="M260 230 q40 -110 60 -160" fill="none" stroke="#6E7F6B" stroke-width="46" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="325" cy="65" rx="34" ry="26" fill="url(#brachioBody)" stroke="#2A3327" stroke-width="7"/>
  <!-- Eye -->
  <circle cx="336" cy="58" r="7" fill="#2A3327"/>
  <circle cx="339" cy="55" r="2.5" fill="#F1E9D2"/>
  <!-- Mouth -->
  <path d="M310 78 q15 8 30 2" fill="none" stroke="#2A3327" stroke-width="4" stroke-linecap="round"/>
</svg>
