<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="velociraptorRealisticTitle">
  <title id="velociraptorRealisticTitle">Velociraptor (ilustración de estilo realista)</title>
  <defs>
    <linearGradient id="raptorBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E5A3F"/>
      <stop offset="1" stop-color="#4E3E29"/>
    </linearGradient>
  </defs>
  <!-- Tail -->
  <path d="M90 280 q-50 -20 -50 -70" fill="none" stroke="#5A4632" stroke-width="24" stroke-linecap="round"/>
  <!-- Legs -->
  <ellipse cx="190" cy="345" rx="22" ry="18" fill="#4E3E29" stroke="#2B2116" stroke-width="6"/>
  <ellipse cx="250" cy="345" rx="22" ry="18" fill="#4E3E29" stroke="#2B2116" stroke-width="6"/>
  <!-- Claw -->
  <path d="M270 335 l24 -10 -4 18 z" fill="#E4D9BE" stroke="#2B2116" stroke-width="4"/>
  <!-- Body -->
  <ellipse cx="220" cy="255" rx="95" ry="70" fill="url(#raptorBody)" stroke="#2B2116" stroke-width="8"/>
  <!-- Feather texture -->
  <g stroke="#8C5A3C" stroke-width="3" opacity="0.7">
    <path d="M180 220 q16 -8 32 0"/>
    <path d="M195 245 q16 -6 32 2"/>
  </g>
  <!-- Belly -->
  <ellipse cx="220" cy="268" rx="55" ry="40" fill="#E4D9BE"/>
  <!-- Arms -->
  <path d="M170 235 q-24 6 -30 28" fill="none" stroke="#6E5A3F" stroke-width="12" stroke-linecap="round"/>
  <!-- Neck/Head -->
  <ellipse cx="315" cy="165" rx="55" ry="40" fill="url(#raptorBody)" stroke="#2B2116" stroke-width="8"/>
  <path d="M340 150 l55 -14 -22 40 z" fill="#6E5A3F" stroke="#2B2116" stroke-width="6"/>
  <!-- Feather crest -->
  <g fill="#8C5A3C" stroke="#2B2116" stroke-width="4">
    <path d="M280 125 l10 -26 12 22 z"/>
    <path d="M300 118 l10 -28 12 24 z"/>
  </g>
  <!-- Eye -->
  <circle cx="330" cy="150" r="9" fill="#2B2116"/>
  <circle cx="333" cy="147" r="3" fill="#F1E9D2"/>
</svg>
