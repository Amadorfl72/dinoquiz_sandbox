# Managed by TrioForge — deterministic security gate.
# Policy: {'secrets': 'block', 'deps': 'block', 'sast': 'warn', 'iac': 'warn', 'lint': 'off'}. Edit via TrioForge re-provisioning rather than by hand.
name: trioforge-security
on:
  pull_request:
permissions:
  contents: read
jobs:
  trioforge-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Secret scan (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSfL "$base/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" | tar -xz gitleaks
          if ! ./gitleaks detect --source . --redact --no-banner --log-opts="$BASE..$HEAD" \
              --report-format json --report-path /tmp/gitleaks.json; then
            jq -r '.[:10][] | "::error file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID): possible secret committed in \(.Commit[0:8])"' /tmp/gitleaks.json 2>/dev/null || true
            echo "::error::trioforge-security: gitleaks detected committed secrets"
            exit 1
          fi
      - name: Dependency scan (osv-scanner)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=https://github.com/google/osv-scanner/releases/download
          curl -sSfL "$base/v1.9.2/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          set +e; ./osv-scanner --format json --recursive ./ > /tmp/osv-pr.json; code=$?; set -e
          if [ "$code" = "1" ]; then
            git worktree add --detach /tmp/tf-osv-base "$BASE" >/dev/null 2>&1 || true
            ./osv-scanner --format json --recursive /tmp/tf-osv-base > /tmp/osv-base.json || true
            jq -e . /tmp/osv-base.json >/dev/null 2>&1 || echo '{}' > /tmp/osv-base.json
            jq -r --slurpfile old /tmp/osv-base.json --arg root "$PWD/" '([$old[0].results[]?.packages[]? | .package.name as $n | .vulnerabilities[]? | "\($n) \(.id)"]) as $known | .results[]? | (.source.path | ltrimstr($root)) as $file | .packages[]? | .package as $p | .vulnerabilities[]? | .id as $id | if ($known | index("\($p.name) \($id)")) then "::warning::osv-scanner: already on the base: \($id) in \($p.name) \($p.version)" else "::error file=\($file)::osv-scanner \($id) in \($p.name) \($p.version)" end' /tmp/osv-pr.json > /tmp/osv-lines || true
            cat /tmp/osv-lines
            if grep -q '^::error' /tmp/osv-lines || [ ! -s /tmp/osv-lines ]; then
              echo "::error::trioforge-security: osv-scanner found vulnerable dependencies"
              exit 1
            fi
          fi
      - name: SAST (semgrep)
        run: |
          pip install --quiet semgrep
          set +e; semgrep --config auto --error --quiet --exclude .github --exclude '*.test.*' --exclude '*.spec.*' --exclude '*_test.*' --exclude tests --exclude test --exclude __tests__ --json -o /tmp/semgrep.json . ; code=$?; set -e
          if [ "$code" != "0" ]; then
            jq -r '.results[:10][] | "::error file=\(.path),line=\(.start.line)::semgrep \(.check_id | split(".") | last): \(.extra.message | gsub("\n";" ") | .[0:350])"' /tmp/semgrep.json 2>/dev/null || true
            echo "::error::trioforge-security: semgrep found SAST issues"
            true
          fi
      - name: IaC scan (checkov)
        run: |
          pip install --quiet checkov
          set +e; checkov -d . --skip-path .github --quiet --compact ; code=$?; set -e
          if [ "$code" != "0" ]; then
            echo "::error::trioforge-security: checkov found IaC misconfigurations"
            true
          fi
