# Static serving config for DinoQuiz (no-build PWA, whole web root under
# public/ — see CONVENTIONS.md). Ensures the manifest and the JSON data the
# app fetch()es at runtime (i18n strings, question bank) get correct MIME
# types instead of nginx's default octet-stream/text guess, and that a
# missing/offline request falls back to the precached offline page.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/manifest+json
    application/javascript
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/svg+xml svg;
        audio/wav wav;
        application/json json;
    }

    location = /manifest.json {
        types {
            application/manifest+json json;
        }
        default_type application/manifest+json;
    }

    location /i18n/ {
        default_type application/json;
    }

    location /data/ {
        default_type application/json;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 = /offline.html;
}
