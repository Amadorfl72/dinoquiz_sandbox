# Static serving config for DinoQuiz (no-build PWA, whole web root under
# public/ — see CONVENTIONS.md). Inherits nginx's stock mime.types (included
# at http level, so images/JS/CSS/JSON are typed correctly) and overrides only
# what that map does not cover: the manifest's application/manifest+json and
# the .wav sounds. A missing/offline request falls back to the precached
# offline page.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/manifest+json
    application/javascript
    application/xml
    image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /manifest.json {
        types {
            application/manifest+json json;
        }
        default_type application/manifest+json;
    }

    location /i18n/ {
        default_type application/json;
    }

    location /data/ {
        default_type application/json;
    }

    location /assets/sounds/ {
        default_type audio/wav;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 = /offline.html;
}
